<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Administrar Planes - NutriVida</title>
  <link rel="stylesheet" href="assets/estilos.css">
</head>
<body>

  <div class="admin-wrapper">
    <aside class="admin-sidebar">
      <div class="admin-logo">
        <img src="assets/img/logo.png" alt="NutriVida">
        <span>NutriVida Admin</span>
      </div>
      <nav aria-label="Navegación administrador">
        <ul>
          <li><a href="admin-home.html">Inicio</a></li>
          <li><a href="admin-productos.html" class="activo">Planes (Productos)</a></li>
          <li><a href="admin-usuarios.html">Usuarios</a></li>
        </ul>
      </nav>
      <a href="index.html" class="admin-salir">Salir al sitio &rarr;</a>
    </aside>

    <main class="admin-contenido">
      <div class="admin-encabezado-tabla">
        <h2>Planes</h2>
        <a href="admin-producto-form.html" class="boton">+ Nuevo Plan</a>
      </div>

      <table class="tabla-admin">
        <thead>
          <tr>
            <th>Código</th>
            <th>Nombre</th>
            <th>Precio</th>
            <th>Stock</th>
            <th>Categoría</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody id="tabla-admin-productos">
          <!-- Filas generadas dinámicamente por js/app.js -->
        </tbody>
      </table>
    </main>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
