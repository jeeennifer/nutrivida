<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nuevo Usuario - NutriVida</title>
  <link rel="stylesheet" href="assets/estilos.css">
</head>
<body>

  <div class="admin-wrapper">
    <aside class="admin-sidebar">
      <div class="admin-logo">
        <img src="assets/img/logo.png" alt="NutriVida">
        <span>NutriVida Admin</span>
      </div>
      <nav aria-label="Navegación administrador">
        <ul>
          <li><a href="admin-home.html">Inicio</a></li>
          <li><a href="admin-productos.html">Planes (Productos)</a></li>
          <li><a href="admin-usuarios.html" class="activo">Usuarios</a></li>
        </ul>
      </nav>
      <a href="index.html" class="admin-salir">Salir al sitio &rarr;</a>
    </aside>

    <main class="admin-contenido">
      <a href="admin-usuarios.html" class="enlace-volver">&larr; Volver al listado</a>

      <div class="form-contenedor" style="max-width: 700px; margin: 0;">
        <div class="titulos-seccion" style="text-align: left;">
          <h2 id="titulo-form-usuario">Nuevo Usuario</h2>
        </div>

        <!-- novalidate apaga la alerta del navegador para usar nuestro JS -->
        <form id="formulario-usuario-admin" class="formulario" novalidate>
          <input type="hidden" id="usuario-id">

          <div class="grupo-form">
            <label for="run-admin">RUN:</label>
            <input type="text" id="run-admin" placeholder="Ej: 19011022K (sin puntos ni guión)" autocomplete="off">
            <span id="error-run-admin" class="mensaje-error" style="display: none;"></span>
          </div>

          <div class="grupo-form">
            <label for="nombre-admin">Nombre:</label>
            <input type="text" id="nombre-admin" placeholder="Ej: Camila" autocomplete="off">
            <span id="error-nombre-admin" class="mensaje-error" style="display: none;"></span>
          </div>

          <div class="grupo-form">
            <label for="apellidos-admin">Apellidos:</label>
            <input type="text" id="apellidos-admin" placeholder="Ej: Fuentes Rojas" autocomplete="off">
            <span id="error-apellidos-admin" class="mensaje-error" style="display: none;"></span>
          </div>

          <div class="grupo-form">
            <label for="email-admin">Correo Electrónico:</label>
            <input type="email" id="email-admin" placeholder="ejemplo@correo.com" autocomplete="off">
            <span id="error-email-admin" class="mensaje-error" style="display: none;"></span>
          </div>

          <div class="grupo-form">
            <label for="fecha-nacimiento-admin">Fecha de Nacimiento (opcional):</label>
            <input type="date" id="fecha-nacimiento-admin">
            <span id="error-fecha-nacimiento-admin" class="mensaje-error" style="display: none;"></span>
          </div>

          <div class="grupo-form">
            <label for="tipo-usuario">Tipo de Usuario:</label>
            <select id="tipo-usuario">
              <option value="">-- Seleccione un tipo --</option>
              <option value="Administrador">Administrador</option>
              <option value="Vendedor">Vendedor</option>
              <option value="Cliente">Cliente</option>
            </select>
            <span id="error-tipo-usuario" class="mensaje-error" style="display: none;"></span>
          </div>

          <div class="grupo-form">
            <label for="region-admin">Región:</label>
            <select id="region-admin">
              <option value="">-- Seleccione la región --</option>
            </select>
            <span id="error-region-admin" class="mensaje-error" style="display: none;"></span>
          </div>

          <div class="grupo-form">
            <label for="comuna-admin">Comuna:</label>
            <select id="comuna-admin">
              <option value="">-- Seleccione primero una región --</option>
            </select>
            <span id="error-comuna-admin" class="mensaje-error" style="display: none;"></span>
          </div>

          <div class="grupo-form">
            <label for="direccion-admin">Dirección:</label>
            <input type="text" id="direccion-admin" placeholder="Ej: Av. Alemania 1234" autocomplete="off">
            <span id="error-direccion-admin" class="mensaje-error" style="display: none;"></span>
          </div>

          <button type="submit" class="boton" style="width: 100%; margin-top: 15px;">Guardar Usuario</button>
        </form>
      </div>
    </main>
  </div>

  <script src="js/app.js"></script>
  <script src="js/validaciones.js"></script>
</body>
</html>
