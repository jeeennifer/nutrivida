<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nuevo/Editar Usuario - Panel Administrador NutriVida</title>
  <link rel="icon" type="image/png" href="assets/img/Nutri.png">
  <link rel="stylesheet" href="assets/estilos.css">
</head>
<body>

  <header>
    <div class="contenedor encabezado">
      <a href="admin-home.html" class="logo">
        <img src="assets/img/logo.png" alt="NutriVida" class="logo-img">
      </a>
      <nav aria-label="Navegación del administrador">
        <ul>
          <li><a href="admin-home.html">Inicio</a></li>
          <li><a href="admin-planes.html">Planes</a></li>
          <li><a href="admin-usuarios.html">Usuarios</a></li>
          <li><a href="index.html">Ver sitio</a></li>
        </ul>
      </nav>
      <div class="acciones-header">
        <button id="cerrar-sesion-admin" class="boton boton-secundario">Cerrar sesión</button>
      </div>
    </div>
  </header>

  <main class="contenedor seccion">
    <a href="admin-usuarios.html" class="enlace-volver">&larr; Volver al listado</a>

    <div class="form-contenedor">
      <div class="titulos-seccion">
        <h2 id="titulo-form-usuario">Nuevo usuario</h2>
      </div>

      <form id="form-usuario" class="formulario" novalidate>
        <div class="grupo-form">
          <label for="run-usuario">RUN (sin puntos ni guion):</label>
          <input type="text" id="run-usuario" maxlength="9" placeholder="Ej: 19011022K">
          <span id="error-run-usuario" class="mensaje-error" style="display: none;"></span>
        </div>

        <div class="grupo-form">
          <label for="nombre-usuario">Nombre:</label>
          <input type="text" id="nombre-usuario" maxlength="50">
          <span id="error-nombre-usuario" class="mensaje-error" style="display: none;"></span>
        </div>

        <div class="grupo-form">
          <label for="apellidos-usuario">Apellidos:</label>
          <input type="text" id="apellidos-usuario" maxlength="100">
          <span id="error-apellidos-usuario" class="mensaje-error" style="display: none;"></span>
        </div>

        <div class="grupo-form">
          <label for="correo-usuario">Correo electrónico:</label>
          <input type="email" id="correo-usuario" maxlength="100">
          <span id="error-correo-usuario" class="mensaje-error" style="display: none;"></span>
        </div>

        <div class="grupo-form">
          <label for="tipo-usuario">Tipo de usuario:</label>
          <select id="tipo-usuario">
            <option value="">Selecciona tipo</option>
            <option value="Administrador">Administrador</option>
            <option value="Nutricionista">Nutricionista</option>
            <option value="Paciente">Paciente</option>
          </select>
          <span id="error-tipo-usuario" class="mensaje-error" style="display: none;"></span>
        </div>

        <button type="submit" class="boton" style="width: 100%; margin-top: 15px;">Guardar usuario</button>
        <p id="mensaje-usuario" class="mensaje-formulario"></p>
      </form>
    </div>
  </main>

  <footer class="footer-minimalista">
    <div class="contenedor">
      <p>NutriVida &middot; Panel Administrador &middot; DSY1104</p>
    </div>
  </footer>

  <script src="js/datos.js"></script>
  <script src="js/validaciones.js"></script>
  <script src="js/admin-auth.js"></script>
  <script src="js/admin-usuario-form.js"></script>
</body>
</html>
