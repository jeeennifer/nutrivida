<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contacto - NutriVida</title>
  <link rel="stylesheet" href="assets/estilos.css">
</head>
<body>

  <header>
    <div class="contenedor encabezado">
      <a href="index.html" class="logo">
        <img src="assets/img/logo.png" alt="NutriVida" class="logo-img">
      </a>
      <nav aria-label="Navegación principal">
        <ul>
          <li><a href="index.html">Inicio</a></li>
          <li><a href="planes.html">Planes</a></li>
          <li><a href="nosotros.html">Nosotros</a></li>
          <li><a href="blog.html">Blog</a></li>
          <li><a href="contacto.html">Contacto</a></li>
        </ul>
      </nav>
      <div class="acciones-header">
        <a href="carrito.html" class="btn-carrito" style="text-decoration: none;">
          Mis Horas (<span id="contador-carrito">0</span>)
        </a>
        <a href="login.html" class="boton-ingresar">Ingresar</a>
      </div>
    </div>
  </header>

  <main class="contenedor seccion">
    <div class="form-contenedor">
      <div class="titulos-seccion">
        <h2>Contáctanos</h2>
        <p>Envíanos tus dudas y te responderemos a la brevedad.</p>
      </div>

      <form id="formulario-contacto" class="formulario" novalidate>
        <div class="grupo-form">
          <label for="nombre-contacto">Nombre completo:</label>
          <input type="text" id="nombre-contacto" placeholder="Ej: Juan Pérez" autocomplete="name">
          <span id="error-nombre-contacto" class="mensaje-error" style="display: none;"></span>
        </div>

        <div class="grupo-form">
          <label for="email-contacto">Correo Electrónico:</label>
          <input type="email" id="email-contacto" placeholder="ejemplo@correo.com" autocomplete="email">
          <span id="error-email-contacto" class="mensaje-error" style="display: none;"></span>
        </div>

        <div class="grupo-form">
          <label for="mensaje-contacto">Tu mensaje:</label>
          <textarea id="mensaje-contacto" rows="5" placeholder="Escribe tu consulta aquí..."></textarea>
          <span id="error-mensaje-contacto" class="mensaje-error" style="display: none;"></span>
        </div>

        <button type="submit" class="boton" style="width: 100%; margin-top: 15px;">Enviar Mensaje</button>
        <p id="mensaje-contacto-resultado" class="mensaje-formulario"></p>
      </form>
    </div>
  </main>

  <footer class="footer-minimalista">
    <div class="contenedor">
      <p>NutriVida &middot; Clínica de Asesoría Nutricional &middot; Temuco, Región de La Araucanía</p>
      <p>Desarrollado por: Vicente, Michael y Jennifer &middot; DSY1104</p>
    </div>
  </footer>

  <script src="js/carrito.js"></script>
  <script src="js/validaciones.js"></script>
  <script src="js/contacto.js"></script>
</body>
</html>
