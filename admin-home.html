<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel Administrador - NutriVida</title>
  <link rel="icon" type="image/png" href="assets/img/Nutri.png">
  <link rel="stylesheet" href="assets/estilos.css">
</head>
<body>

  <header>
    <div class="contenedor encabezado">
      <a href="admin-home.html" class="logo">
        <img src="assets/img/logo.png" alt="NutriVida" class="logo-img">
      </a>
      <nav aria-label="Navegación del administrador">
        <ul>
          <li><a href="admin-home.html">Inicio</a></li>
          <li><a href="admin-planes.html">Planes</a></li>
          <li><a href="admin-usuarios.html">Usuarios</a></li>
          <li><a href="index.html">Ver sitio</a></li>
        </ul>
      </nav>
      <div class="acciones-header">
        <button id="cerrar-sesion-admin" class="boton boton-secundario">Cerrar sesión</button>
      </div>
    </div>
  </header>

  <main class="contenedor seccion">
    <div class="titulos-seccion">
      <p class="subtitulo">PANEL ADMINISTRADOR</p>
      <h2>Bienvenido/a</h2>
    </div>

    <!-- Diseño libre y minimalista: solo dos accesos directos,
         tal como pide la rúbrica para la vista "Home" del admin -->
    <div class="grilla-productos" style="grid-template-columns: repeat(2, 1fr); max-width: 700px; margin: 0 auto;">
      <article class="producto">
        <div class="producto-contenido" style="text-align: center;">
          <h3>Planes</h3>
          <p class="descripcion-plan">Crear, editar o eliminar los planes de la clínica.</p>
          <a href="admin-planes.html" class="boton" style="width: 100%;">Ir a Planes</a>
        </div>
      </article>
      <article class="producto">
        <div class="producto-contenido" style="text-align: center;">
          <h3>Usuarios</h3>
          <p class="descripcion-plan">Crear, editar o eliminar usuarios del sistema.</p>
          <a href="admin-usuarios.html" class="boton" style="width: 100%;">Ir a Usuarios</a>
        </div>
      </article>
    </div>
  </main>

  <footer class="footer-minimalista">
    <div class="contenedor">
      <p>NutriVida &middot; Panel Administrador &middot; DSY1104</p>
    </div>
  </footer>

  <script src="js/admin-auth.js"></script>
</body>
</html>
