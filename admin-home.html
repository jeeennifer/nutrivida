<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel Administrador - NutriVida</title>
  <link rel="stylesheet" href="assets/estilos.css">
</head>
<body>

  <div class="admin-wrapper">
    <aside class="admin-sidebar">
      <div class="admin-logo">
        <img src="assets/img/logo.png" alt="NutriVida">
        <span>NutriVida Admin</span>
      </div>
      <nav aria-label="Navegación administrador">
        <ul>
          <li><a href="admin-home.html" class="activo">Inicio</a></li>
          <li><a href="admin-productos.html">Planes (Productos)</a></li>
          <li><a href="admin-usuarios.html">Usuarios</a></li>
        </ul>
      </nav>
      <a href="index.html" class="admin-salir">Salir al sitio &rarr;</a>
    </aside>

    <main class="admin-contenido">
      <h2>¡Hola, Administrador!</h2>
      <p style="color:#555; margin-bottom: 30px;">Este es el panel de gestión de NutriVida. Desde aquí puedes administrar los planes y los usuarios del sistema.</p>

      <div class="admin-tarjetas-resumen">
        <div class="admin-tarjeta-resumen">
          <h3 id="resumen-total-planes">0</h3>
          <p>Planes activos</p>
        </div>
        <div class="admin-tarjeta-resumen">
          <h3 id="resumen-total-usuarios">0</h3>
          <p>Usuarios registrados</p>
        </div>
      </div>
    </main>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
