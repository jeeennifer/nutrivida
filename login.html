<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ingresar - NutriVida</title>
  <link rel="stylesheet" href="assets/estilos.css">
</head>
<body>

  <header>
    <div class="contenedor encabezado">
      <a href="index.html" class="logo">
        <img src="assets/img/logo.png" alt="NutriVida" class="logo-img">
      </a>
      <nav aria-label="Navegación principal">
        <ul>
          <li><a href="index.html">Inicio</a></li>
          <li><a href="planes.html">Planes</a></li>
          <li><a href="nosotros.html">Nosotros</a></li>
          <li><a href="blog.html">Blog</a></li>
          <li><a href="contacto.html">Contacto</a></li>
        </ul>
      </nav>
      <div class="acciones-header">
        <a href="carrito.html" class="btn-carrito" style="text-decoration: none;">
          Mis Horas (<span id="contador-carrito">0</span>)
        </a>
      </div>
    </div>
  </header>

  <main class="contenedor seccion">
    <div class="form-contenedor">
      <div class="titulos-seccion">
        <h2>Iniciar Sesión</h2>
        <p>Ingresa tus datos para confirmar tu agendamiento</p>
      </div>

      <!-- novalidate apaga la alerta del navegador para usar nuestro JS -->
      <form id="formulario-login" class="formulario" novalidate>
        <div class="grupo-form">
          <label for="email">Correo Electrónico:</label>
          <input type="email" id="email" placeholder="ejemplo@correo.com" autocomplete="email">
          <span id="error-email" class="mensaje-error" style="display: none; color: #ff4d4d; font-size: 0.85rem; margin-top: 5px;"></span>
        </div>

        <div class="grupo-form">
          <label for="password">Contraseña:</label>
          <input type="password" id="password" placeholder="Mínimo 6 caracteres" autocomplete="current-password">
          <span id="error-password" class="mensaje-error" style="display: none; color: #ff4d4d; font-size: 0.85rem; margin-top: 5px;"></span>
        </div>

        <button type="submit" class="boton" style="width: 100%; margin-top: 15px;">Ingresar y Confirmar</button>
      </form>
    </div>
  </main>

  <footer class="footer-minimalista">
    <div class="contenedor">
      <p>NutriVida &middot; Clínica de Asesoría Nutricional &middot; Temuco, Región de La Araucanía</p>
      <p>Desarrollado por: Vicente, Michael y Jennifer &middot; DSY1104</p>
    </div>
  </footer>

  <script src="js/app.js"></script>
  <script src="js/validaciones.js"></script>
</body>
</html>
